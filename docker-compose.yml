services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    restart: unless-stopped
    ports:
      - 3001:3000
    # NUXT_BLOG_HMAC_SECRET comes from ./.env - copy .env.example first.
    env_file:
      - .env
    environment:
      # Server-side calls to Nest happen inside this container, where
      # "localhost" is the container itself - so target the host machine.
      # `extra_hosts` below makes host.docker.internal resolve on Linux too
      # (Docker Desktop on Mac/Windows already provides it).
      - NUXT_NEST_API_URL=http://host.docker.internal:4000/v1/api
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - tunnelnet

networks:
  tunnelnet:
    external: true